# kiss_icp_localization — 3D / 2.5D Livox voxel-ICP localization on the real car.
# Publishes the pose DIRECTLY on /car_state/odom (+ TF map->base_link), no EKF.
#
# Only keys that DIFFER from the node defaults (or matter for safety / 2.5D / are
# per-car) are listed here — everything else uses localization_node.cpp defaults.
# Full rationale + tuning notes live in this package's CLAUDE.md.
#
# The ground-band crop (crop_*) is set HERE, not in <map>_ground_lidar.yaml
# (that auto-load was removed). All crop_* keys are live-tunable (ros2 param set).
kiss_icp_localization:
  ros__parameters:
    # ===================== PER-CAR — do NOT whole-file sync between cars =========
    # car1 (mac) and car2 (nuc) differ here. When deploying, change ONLY these keys;
    # never scp the whole file (it silently reverts the other car's values).
    stamp_at_scan_end: false     # car1: true (stock msg_MID360 END-stamps) | car2: false (direct-node BEGIN-stamps)
    adaptive_range: 15.0         # car1: 15.0 | car2: 60.0   (15 tightens threshold -> lock-loss risk)
    map_z_offset: 0.158          # car1: 0.158 | car2: measure via `tf2_echo map base_link`

    # ===================== mode ==================================================
    input_mode: "3d"             # "3d" (full scan) | "2.5d" (keep floor..crop_z_max only)

    # ===================== ground-band crop (2.5D input + detection band viz) ====
    # Height of a point above ground = crop_ground_normal . p + crop_ground_offset.
    # 2.5D keeps points with height <= crop_z_max (floor kept); crop_z_min is the
    # lower bound used by the 2D band / band viz. normal+offset = the LiDAR mount
    # tilt vs ground (measured from GLIM on the ifac recording; re-measure per car
    # if the mount changes). All live-tunable.
    crop_ground_normal: [-0.257637, -0.011867, 0.966169]
    crop_ground_offset: 0.1378
    crop_z_min: 0.15
    crop_z_max: 0.3

    # ===================== I/O (non-default) =====================================
    odom_topic: "/car_state/odom"    # default is /kiss_loc/odometry — MUST override for the stack
    odom_twist_topic: "/vesc/odom"   # wheel twist.vx -> translation prediction

    # ===================== prediction / deskew (non-default) =====================
    deskew_accel: true           # time-varying-v deskew (accel term)
    planar_prediction: true      # propagate only map xy+yaw; z/roll/pitch from LiDAR ICP only

    # ===================== registration safety envelope =========================
    reject_trans: 2.0            # divergence gate: reject a fix jumping > this [m]
    reject_rot_deg: 30.0         #                  ... or > this [deg] from prediction
    reject_recover_count: 3      # consecutive rejects before re-anchoring to the fix
    max_velocity: 15.0           # speed cap (corridor-degenerate runaway guard) [m/s]
    max_accel: 10.0              # accel cap [m/s^2]

    # ===================== BEV detection (opponents / unmapped obstacles) ========
    detect_en: true
    detect_track_filter: true    # reject returns off the track mask (walls/exterior)
    detect_z_min: 0.2            # detection z-band (MAP frame) — separate from crop_z_* above
    detect_z_max: 0.50
    detect_res: 0.05             # BEV cell size [m]
    detect_eps: 0.3              # DBSCAN neighborhood radius [m]
    detect_min_samples: 2        # sparse scan -> low core threshold
    # Ego self-return box, SENSOR frame (x forward -> -x behind). ~0.2x0.2 behind
    # base_link; drag onto the self-hit live in RViz.
    detect_self_filter: true
    detect_self_x_min: -0.45
    detect_self_x_max: -0.25
    detect_self_y_min: -0.10
    detect_self_y_max: 0.10

    # ===================== output / debug =======================================
    publish_2d_map: false        # map_server owns /map
    print_stats: true            # STAT lines for bag_validation / tuning
